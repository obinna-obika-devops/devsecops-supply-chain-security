apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-secure-images
  annotations:
    policies.kyverno.io/title: Verify signed images
    policies.kyverno.io/category: Supply Chain Security
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: require-digest
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: Images must be pinned by digest.
        pattern:
          spec:
            containers:
              - image: "*:*@sha256:*"
    - name: disallow-latest
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: The latest tag is not allowed.
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"

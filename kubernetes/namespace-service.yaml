apiVersion: v1
kind: Namespace
metadata:
  name: secure-demo
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Service
metadata:
  name: secure-demo
  namespace: secure-demo
spec:
  selector:
    app: secure-demo
  ports:
    - port: 80
      targetPort: 8080

name: Secure Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/secure-demo:${{ github.ref_name }}
          provenance: true
          sbom: true
      - name: Sign image with GitHub OIDC
        uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/secure-demo@${{ steps.build.outputs.digest }}
      - name: Verify signature
        run: cosign verify ghcr.io/${{ github.repository_owner }}/secure-demo@${{ steps.build.outputs.digest }} --certificate-identity-regexp='https://github.com/${{ github.repository }}/.github/workflows/.*' --certificate-oidc-issuer='https://token.actions.githubusercontent.com'
